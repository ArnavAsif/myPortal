<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640">
  <defs>
    <!-- Guilloche Rosette Filter / Pattern -->
    <radialGradient id="certBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f7f2e7"/>
    </radialGradient>
    <radialGradient id="goldSeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997a15"/>
    </radialGradient>
    <radialGradient id="pinkRosette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f9d5e5" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#eeac99" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e06377" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="640" fill="url(#certBg)" />

  <!-- Outer Ornate Border -->
  <rect x="25" y="25" width="850" height="590" rx="4" fill="none" stroke="#162e58" stroke-width="4"/>
  <rect x="33" y="33" width="834" height="574" rx="2" fill="none" stroke="#cca23b" stroke-width="1.5"/>
  <rect x="38" y="38" width="824" height="564" rx="1" fill="none" stroke="#162e58" stroke-width="0.75" stroke-dasharray="6 3"/>

  <!-- Corner Flourishes -->
  <g stroke="#162e58" stroke-width="2" fill="none">
    <!-- Top-left -->
    <path d="M 25 55 Q 55 55 55 25" />
    <circle cx="45" cy="45" r="4" fill="#cca23b" stroke="#162e58" />
    <!-- Top-right -->
    <path d="M 875 55 Q 845 55 845 25" />
    <circle cx="855" cy="45" r="4" fill="#cca23b" stroke="#162e58" />
    <!-- Bottom-left -->
    <path d="M 25 585 Q 55 585 55 615" />
    <circle cx="45" cy="595" r="4" fill="#cca23b" stroke="#162e58" />
    <!-- Bottom-right -->
    <path d="M 875 585 Q 845 585 845 615" />
    <circle cx="855" cy="595" r="4" fill="#cca23b" stroke="#162e58" />
  </g>

  <!-- Top Identification Info -->
  <text x="60" y="68" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#334155">
    Graduation ID: <tspan fill="#0f172a">789107238548</tspan>
  </text>
  <text x="840" y="68" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#334155" text-anchor="end">
    Reg No: <tspan fill="#0f172a">358737</tspan>
  </text>

  <!-- Central Crest / Logo -->
  <g transform="translate(415, 82) scale(0.45)">
    <!-- Outer circle border -->
    <circle cx="80" cy="80" r="76" fill="#ffffff" stroke="#162e58" stroke-width="5" />
    <circle cx="80" cy="80" r="71" fill="none" stroke="#cca23b" stroke-width="3" />
    <circle cx="80" cy="80" r="50" fill="#f0f5fa" stroke="#162e58" stroke-width="3" />
    <g transform="translate(48, 52)" fill="#162e58">
      <circle cx="32" cy="18" r="9" fill="#cca23b"/>
      <path d="M32 29 C24 23 10 24 4 26 L4 46 C11 43 23 43 32 47 C41 43 53 43 60 46 L60 26 C54 24 40 23 32 29 Z" fill="#162e58" stroke="#10213d" stroke-width="2"/>
    </g>
  </g>

  <!-- University Title -->
  <text x="450" y="175" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" font-size="34" font-weight="bold" fill="#112240" text-anchor="middle" letter-spacing="1">
    University of Development Alternative
  </text>
  
  <text x="450" y="198" font-family="'Times New Roman', serif" font-size="13" font-style="italic" fill="#556677" text-anchor="middle" letter-spacing="1.5">
    DHAKA, BANGLADESH
  </text>

  <!-- Decorative Separator Line -->
  <path d="M 280 208 L 410 208 M 430 208 L 470 208 M 490 208 L 620 208" stroke="#cca23b" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="450,205 454,208 450,211 446,208" fill="#cca23b" />

  <!-- Degree Title -->
  <text x="450" y="248" font-family="'Old English Text MT', 'Cinzel Decorative', 'Georgia', serif" font-size="32" font-weight="bold" fill="#162e58" text-anchor="middle">
    Bachelor of Business Administration
  </text>

  <!-- Certification Preamble -->
  <text x="450" y="284" font-family="'Times New Roman', serif" font-size="17" font-style="italic" fill="#475569" text-anchor="middle">
    This is to certify that
  </text>

  <!-- Student Name -->
  <text x="450" y="328" font-family="'Brush Script MT', 'Great Vibes', 'Edwardian Script ITC', 'Lucida Calligraphy', cursive, serif" font-size="38" font-weight="bold" fill="#0f172a" text-anchor="middle">
    Tania Akter
  </text>
  <line x1="310" y1="334" x2="590" y2="334" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4 2"/>

  <!-- Degree Description Paragraph -->
  <text x="450" y="365" font-family="'Times New Roman', serif" font-size="16" fill="#334155" text-anchor="middle">
    obtained the Degree of <tspan font-weight="bold" fill="#0f172a">Bachelor of Business Administration</tspan> in Management
  </text>
  <text x="450" y="392" font-family="'Times New Roman', serif" font-size="16" fill="#334155" text-anchor="middle">
    with honours in this University at the Examination of <tspan font-weight="bold" fill="#0f172a">Fall 2020</tspan>.
  </text>
  
  <text x="450" y="426" font-family="'Times New Roman', serif" font-size="16" fill="#334155" text-anchor="middle">
    He/She secured Cumulative Grade Point Average (CGPA) <tspan font-weight="bold" font-size="18" fill="#162e58">3.25</tspan> on a scale of 4.00.
  </text>

  <!-- Center Security Rosette / Guilloche watermark -->
  <g transform="translate(450, 485)">
    <circle cx="0" cy="0" r="70" fill="url(#pinkRosette)" />
    <!-- Concentric floral lace rings -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#e06377" stroke-width="0.75" opacity="0.4" stroke-dasharray="3 2" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#cca23b" stroke-width="1" opacity="0.6" stroke-dasharray="5 3" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#162e58" stroke-width="0.75" opacity="0.5" />
    <text x="0" y="4" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#991b1b" opacity="0.7" text-anchor="middle">
      OFFICIAL SEAL
    </text>
  </g>

  <!-- Bottom Left: QR Code & Issue Date -->
  <g transform="translate(68, 485)">
    <!-- QR Code Box -->
    <rect x="0" y="0" width="70" height="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="3"/>
    <!-- Realistic QR pattern -->
    <rect x="5" y="5" width="22" height="22" fill="#0f172a"/>
    <rect x="8" y="8" width="16" height="16" fill="#ffffff"/>
    <rect x="11" y="11" width="10" height="10" fill="#0f172a"/>
    
    <rect x="43" y="5" width="22" height="22" fill="#0f172a"/>
    <rect x="46" y="8" width="16" height="16" fill="#ffffff"/>
    <rect x="49" y="11" width="10" height="10" fill="#0f172a"/>

    <rect x="5" y="43" width="22" height="22" fill="#0f172a"/>
    <rect x="8" y="46" width="16" height="16" fill="#ffffff"/>
    <rect x="11" y="49" width="10" height="10" fill="#0f172a"/>

    <!-- Data bits -->
    <rect x="32" y="8" width="5" height="12" fill="#0f172a"/>
    <rect x="10" y="32" width="12" height="5" fill="#0f172a"/>
    <rect x="32" y="32" width="8" height="8" fill="#0f172a"/>
    <rect x="45" y="32" width="6" height="6" fill="#0f172a"/>
    <rect x="55" y="35" width="8" height="8" fill="#0f172a"/>
    <rect x="35" y="45" width="10" height="5" fill="#0f172a"/>
    <rect x="50" y="45" width="12" height="10" fill="#0f172a"/>
    <rect x="35" y="55" width="7" height="9" fill="#0f172a"/>

    <!-- Date of issue -->
    <text x="0" y="92" font-family="'Times New Roman', serif" font-size="13" font-style="italic" fill="#475569">
      Date of Issue: <tspan font-weight="bold" fill="#0f172a">01-12-2020</tspan>
    </text>
  </g>

  <!-- Bottom Right: Signatures -->
  <g transform="translate(620, 520)">
    <!-- Controller signature -->
    <path d="M 20 5 Q 35 -15 50 10 T 80 -8 T 110 5 Q 120 12 135 2" stroke="#0f172a" stroke-width="1.8" fill="none"/>
    <line x1="0" y1="20" x2="160" y2="20" stroke="#64748b" stroke-width="1"/>
    <text x="80" y="35" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">
      Controller of Examinations
    </text>
  </g>

  <!-- Vice Chancellor signature -->
  <g transform="translate(410, 545)">
    <text x="40" y="32" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">
      Vice-Chancellor
    </text>
  </g>
</svg>
