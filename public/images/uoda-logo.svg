<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <path id="textCircle" d="M 80, 80 m -62, 0 a 62,62 0 1,1 124,0 a 62,62 0 1,1 -124,0" />
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer circle border -->
  <circle cx="80" cy="80" r="76" fill="#ffffff" stroke="#162e58" stroke-width="3" />
  <circle cx="80" cy="80" r="71" fill="none" stroke="#cca23b" stroke-width="1.5" />
  <circle cx="80" cy="80" r="50" fill="#f0f5fa" stroke="#162e58" stroke-width="2" />
  
  <!-- Circular text -->
  <text font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#162e58" letter-spacing="1.5">
    <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
      UNIVERSITY OF DEVELOPMENT ALTERNATIVE • UODA •
    </textPath>
  </text>
  
