    <path d="M32 29 L32 47" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M9 31 C16 29 25 29 30 33" stroke="#ffffff" stroke-width="1" fill="none"/>
    <path d="M9 36 C16 34 25 34 30 38" stroke="#ffffff" stroke-width="1" fill="none"/>
    <path d="M55 31 C48 29 39 29 34 33" stroke="#ffffff" stroke-width="1" fill="none"/>
    <path d="M55 36 C48 34 39 34 34 38" stroke="#ffffff" stroke-width="1" fill="none"/>
